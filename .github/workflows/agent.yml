name: Agent Setup

on:
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Clawhub
        run: npm install -g clawhub

      - name: Install Skill
        run: clawhub install verified-agent-identity
